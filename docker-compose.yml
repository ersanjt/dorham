services:
  postgres:
    image: postgres:16-alpine
    container_name: dorham-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dorham
      POSTGRES_PASSWORD: dorham
      POSTGRES_DB: dorham
    ports:
      - "5432:5432"
    volumes:
      - dorham_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorham"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dorham-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dorham_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dorham_pg:
  dorham_redis:
